[project]
name = "audio-angel"
version = "0.1.0"
description = "Streamlit app that mutes words in songs and podcasts with a Pydantic AI flagging agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "logfire[httpx]>=5.5.0",
    "minsearch>=0.2.0",
    "modal>=1.6.3",
    "numpy>=2.5.4",
    "pydantic-ai-slim[logfire,openai]>=2.66.0",
    "pydantic-evals[logfire]>=2.66.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-m 'not judge'"
markers = [
    "judge: tests that call a live LLM judge (deselected by default)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"
