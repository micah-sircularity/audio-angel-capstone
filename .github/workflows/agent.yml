name: agent

on:
  push:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"

defaults:
  run:
    working-directory: agent

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Unit tests (offline)
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t audio-angel-agent agent
